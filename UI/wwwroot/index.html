<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101330" />
    <title>ElecTrace — نظام فواتير الكهرباء</title>
    <base href="/" />

    <!-- تطبيق الثيم قبل تحميل الستايل حتى ما تصير "ومضة" بيضا عند فتح الصفحة بالوضع الليلي -->
    <script>
        (function () {
            window.appTheme = {
                current: function () {
                    return document.documentElement.getAttribute('data-theme') || 'light';
                },
                apply: function (theme) {
                    document.documentElement.setAttribute('data-theme', theme);
                    // مزامنة ثيم Bootstrap كمان، حتى متغيراته (لون النص، سهم القوائم...) تتبع الوضع الليلي
                    document.documentElement.setAttribute('data-bs-theme', theme);
                    var meta = document.querySelector('meta[name="theme-color"]');
                    if (meta) meta.setAttribute('content', theme === 'dark' ? '#080a16' : '#101330');
                    try { localStorage.setItem('elec.theme', theme); } catch (e) { }
                    return theme;
                },
                toggle: function () {
                    return window.appTheme.apply(window.appTheme.current() === 'dark' ? 'light' : 'dark');
                }
            };

            var stored = null;
            try { stored = localStorage.getItem('elec.theme'); } catch (e) { }
            if (stored !== 'dark' && stored !== 'light') {
                stored = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            window.appTheme.apply(stored);
        })();
    </script>

    <link rel="preload" id="webassembly" />
    <link rel="preload" href="fonts/plex-400-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/plex-600-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script type="importmap"></script>

    <style>
        /* شاشة الإقلاع - تظهر قبل تحميل التطبيق فقط */
        #app-splash {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            background: #f5f6fb;
            font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
        }

        :root[data-theme="dark"] #app-splash {
            background: #080a16;
        }

        .splash-inner {
            display: grid;
            justify-items: center;
            gap: 1rem;
        }

        .splash-mark {
            display: grid;
            place-items: center;
            width: 64px;
            height: 64px;
            border-radius: 20px;
            color: #fff;
            background-image: linear-gradient(135deg, #4338ca, #7c3aed);
            box-shadow: 0 18px 36px -14px rgba(99, 102, 241, 0.9);
            animation: splashPop 0.6s cubic-bezier(0.34, 1.4, 0.64, 1) both;
        }

        .splash-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #6b7291;
        }

        .splash-bar {
            width: 170px;
            height: 4px;
            border-radius: 99px;
            background: rgba(120, 130, 170, 0.2);
            overflow: hidden;
        }

            .splash-bar::after {
                content: '';
                display: block;
                width: 45%;
                height: 100%;
                border-radius: 99px;
                background-image: linear-gradient(90deg, #6366f1, #a78bfa);
                animation: splashSlide 1.1s ease-in-out infinite;
            }

        @keyframes splashPop {
            from { opacity: 0; transform: scale(0.6) rotate(-10deg); }
            to { opacity: 1; transform: scale(1) rotate(0); }
        }

        @keyframes splashSlide {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(340%); }
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="app-splash">
            <div class="splash-inner">
                <div class="splash-mark">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5z" />
                    </svg>
                </div>
                <span class="splash-title">ElecTrace — جاري تحميل النظام</span>
                <div class="splash-bar"></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        حدث خطأ غير متوقع.
        <a href="." class="reload">تحديث</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        window.downloadFileFromBytes = (fileName, contentType, base64Data) => {
            const link = document.createElement("a");
            link.download = fileName;
            link.href = `data:${contentType};base64,${base64Data}`;
            document.body.appendChild(link);
            link.click();
            link.remove();
        };

        window.downloadFileFromStream = async (fileName, contentStreamReference) => {
            const arrayBuffer = await contentStreamReference.arrayBuffer();
            const blob = new Blob([arrayBuffer]);
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = fileName;
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
            URL.revokeObjectURL(url);
        };
    </script>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
